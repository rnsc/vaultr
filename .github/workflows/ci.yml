name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "not gofmt'ed:"; echo "$out"; exit 1; fi
      - name: go vet
        run: |
          go vet ./...
          go vet -tags integration ./...
      - name: staticcheck
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
          go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 -tags integration ./...
      - name: go.mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: shellcheck
        run: shellcheck scripts/*.sh && shellcheck -s bash internal/complete/shells/*.bash

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test -race -count=1 -coverprofile=coverage-unit.out ./...
      - name: Coverage
        run: |
          echo "### Unit test coverage" >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage-unit.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: integration (${{ matrix.vault }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Pinned runner images: ubuntu-latest moves to 26.04 in Oct-Nov 2026
        # (actions/runner-images#14748); see integration-next below.
        os: [ubuntu-24.04]
        # Vault CE versions, plus OpenBao, which also runs the namespace
        # tests (namespaces are Enterprise-only in Vault).
        vault: ["1.15.6", "1.21.4", "latest", "openbao-2.5.5"]
        include:
          - os: macos-15
            vault: latest
    env:
      VAULT_DEV_PORT: "8200"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/cache@v6
        with:
          path: .cache/vault
          key: vault-${{ runner.os }}-${{ runner.arch }}-${{ matrix.vault }}
      - name: Install fish and zsh (shell completion tests)
        if: matrix.os == 'ubuntu-24.04' && matrix.vault == 'latest'
        run: sudo apt-get install -y -qq fish zsh
      - name: Start Vault dev server
        run: scripts/vault-dev.sh start "${{ matrix.vault }}"
      - name: Integration tests
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: root
        run: >
          go test -tags integration -race -count=1 -v
          -coverpkg=./internal/...
          -coverprofile=coverage-integration.out
          ./integration
      - name: Coverage
        if: always()
        run: |
          if [ -f coverage-integration.out ]; then
            echo "### Integration coverage (vault ${{ matrix.vault }}, ${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
            go tool cover -func=coverage-integration.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Vault server log
        if: failure()
        run: cat .cache/vault/server-8200.log
      - name: Stop Vault
        if: always()
        run: scripts/vault-dev.sh stop

  # Early warning for the next Ubuntu image (ubuntu-latest becomes 26.04
  # in Oct-Nov 2026). Not part of ci-ok, so it never blocks a merge; once
  # it is reliably green, move the pinned images above to ubuntu-26.04.
  integration-next:
    name: integration (latest, ubuntu-26.04, non-blocking)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    continue-on-error: true
    env:
      VAULT_DEV_PORT: "8200"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Start Vault dev server
        run: scripts/vault-dev.sh start latest
      - name: Integration tests
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: root
        run: go test -tags integration -race -count=1 ./integration
      - name: Vault server log
        if: failure()
        run: cat .cache/vault/server-8200.log
      - name: Stop Vault
        if: always()
        run: scripts/vault-dev.sh stop

  # Dry run of the release build (all targets), with the binaries attached
  # to the workflow run for manual testing.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
      - name: Smoke test
        run: |
          ./dist/vaultr_linux_amd64_v1/vaultr version
          ./dist/vaultr_linux_amd64_v1/vaultr help | grep -q Usage
      - name: Homebrew cask is generated and valid Ruby
        run: |
          cask=dist/homebrew/Casks/vaultr.rb
          ruby -c "$cask"
          for want in 'binary "vaultr"' bash_completion zsh_completion fish_completion postflight_steps 'com.apple.quarantine'; do
            grep -q "$want" "$cask" || { echo "::error::$cask lacks $want"; cat "$cask"; exit 1; }
          done
          # Deprecated in Homebrew: warns on every `brew update`.
          if grep -qE '^ *(pre|post)flight do' "$cask"; then
            echo "::error::$cask uses a deprecated preflight/postflight block"; cat "$cask"; exit 1
          fi
      - name: Install script (checksum + install from the built archives)
        run: |
          scripts/install.sh --from dist --dir "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/vaultr" version
      - uses: actions/upload-artifact@v7
        with:
          name: vaultr-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            dist/homebrew/Casks/vaultr.rb
          retention-days: 7

  # Installs the generated cask with the runner's real (updated) Homebrew,
  # from the snapshot archive, the way `brew install rnsc/tap/vaultr` does.
  cask:
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: vaultr-snapshot
          path: dist
      - name: Install the cask from a local tap
        run: |
          brew update --quiet
          brew --version
          brew tap-new --no-git vaultr-ci/local
          tap="$(brew --repository vaultr-ci/local)"
          # Point the download at the snapshot archive (same checksum).
          sed -E "s|https://github.com/rnsc/vaultr/releases/download/[^/]+/|file://$PWD/dist/|" \
            dist/homebrew/Casks/vaultr.rb > "$tap/Casks/vaultr.rb"
          cat "$tap/Casks/vaultr.rb"
          brew install --cask vaultr-ci/local/vaultr 2>&1 | tee install.log
          if grep -qiE 'deprecat|^Warning' install.log; then
            echo "::error::Homebrew warned about the cask (see the log above)"
            exit 1
          fi
      - name: Check the installed cask
        run: |
          vaultr version
          prefix="$(brew --prefix)"
          test -e "$prefix/etc/bash_completion.d/vaultr"
          test -e "$prefix/share/zsh/site-functions/_vaultr"
          test -e "$prefix/share/fish/vendor_completions.d/vaultr.fish"
          bin="$(ls "$(brew --caskroom)"/vaultr/*/vaultr)"
          if xattr -p com.apple.quarantine "$bin" 2>/dev/null; then
            echo "::error::$bin is still quarantined"
            exit 1
          fi
          brew uninstall --cask vaultr-ci/local/vaultr

  # Single required check for branch protection.
  ci-ok:
    if: always()
    needs: [lint, unit, integration, build, cask]
    runs-on: ubuntu-24.04
    steps:
      - name: All jobs passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "some jobs failed: ${{ join(needs.*.result, ', ') }}"
            exit 1
          fi
