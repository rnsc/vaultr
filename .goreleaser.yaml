version: 2

project_name: vaultr

before:
  hooks:
    - go mod download
    - sh -c 'mkdir -p completions && for sh in $(go run . completion list); do go run . completion $sh > completions/vaultr.$sh; done'

builds:
  - id: vaultr
    main: .
    binary: vaultr
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: vaultr
    ids: [vaultr]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - completions/*

checksum:
  name_template: SHA256SUMS

# No Apple notarization: Go's linker ad-hoc signs darwin/arm64 binaries,
# which is all Apple silicon needs to run them. Gatekeeper only objects
# to quarantined downloads (browsers); scripts/install.sh, gh and curl
# don't set the quarantine flag.

# Homebrew: `brew install rnsc/tap/vaultr`. Each release commits the cask
# to rnsc/homebrew-tap, pushing over SSH with a deploy key that can write
# to that repository only (secret HOMEBREW_TAP_SSH_KEY).
homebrew_casks:
  - name: vaultr
    ids: [vaultr]
    binaries: [vaultr]
    homepage: https://github.com/rnsc/vaultr
    description: Fast search over HashiCorp Vault KV paths and key names
    directory: Casks
    completions:
      bash: completions/vaultr.bash
      zsh: completions/vaultr.zsh
      fish: completions/vaultr.fish
    # Homebrew quarantines cask downloads, and Gatekeeper refuses a
    # quarantined binary that isn't notarized (see above). GoReleaser can
    # only generate the deprecated `postflight do` hook (Homebrew warns on
    # every `brew update`), so the `postflight_steps` stanza is written by
    # hand. -r and must_succeed: false: nothing to remove is fine.
    # GoReleaser 2.19 generates it (goreleaser/goreleaser#6870): then move
    # this back to `hooks`; CI's cask job checks the result either way.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{" }}staged_path{{ "}}" }}/vaultr"], must_succeed: false
        end
      end
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    commit_msg_template: "vaultr {{ .Tag }}"
    skip_upload: auto # not for prereleases
    repository:
      owner: rnsc
      name: homebrew-tap
      branch: main
      git:
        url: git@github.com:rnsc/homebrew-tap.git
        private_key: '{{ index .Env "HOMEBREW_TAP_SSH_KEY" }}' # empty in CI snapshots

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^Merge branch"

release:
  draft: false
  prerelease: auto
  footer: |
    Verify downloads with `sha256sum -c SHA256SUMS --ignore-missing`.
